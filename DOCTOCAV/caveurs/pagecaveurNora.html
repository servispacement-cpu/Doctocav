<!DOCTYPE html>
<html>

    <body>

<div class="un">
    <h1>Service DOCTOCAV RESERVATION: Cave Nora</h1>
</div>

    <h3>Nom du client:</h3>
    <p id="nomclient"></p><br>
    <h3>Age du client:</h3>

        <script>
                let nom = localStorage.getItem("nomN");
                let age = localStorage.getItem("ageN");

                if (cond === true){
                    document.getElementById("nomclient").innerHTML = nom;
                    document.getElementById("ageclient").innerHTML = age;
                } else {}
            
        </script>
